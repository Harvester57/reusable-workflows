name: Docker image scheduled build - No cache

on:
  workflow_call:
    inputs:
      platforms:
        description: "Target platforms for Buildx (e.g., linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64"
      tags:
        description: "Custom tag definitions for docker/metadata-action"
        required: false
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      file:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: ""
      fail-build:
        description: "Fail the build if fixable vulnerabilities are detected by Anchore"
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 30

jobs:
  build-nocache:
    name: Build and publish Docker image without cache
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      security-events: write
    # Same-repository reusable workflow call must reference @main rather than a static commit SHA
    uses: Harvester57/reusable-workflows/.github/workflows/docker-reusable-build.yml@main # zizmor: ignore[unpinned-uses]
    with:
      no-cache: true
      platforms: ${{ inputs.platforms }}
      tags: ${{ inputs.tags }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      fail-build: ${{ inputs.fail-build }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
